const AIProvidersPage = ({ t, appSettings }) => {
    const [providers, setProviders] = useState([]);
    const [isTesting, setIsTesting] = useState({});
  
    useEffect(() => { setProviders(ProviderRegistry.listProviders()); }, []);
  
    const handleAddProvider = async () => {
      const typeChoice = prompt("Enter Provider Type (1 for Mock, 2 for Google Gemini):", "2");
      if (!typeChoice) return;
      const isGoogle = typeChoice === "2";
      const apiKey = prompt(`Enter API key for ${isGoogle ? 'Google Gemini' : 'Mock Provider'} (Will only be stored in memory):`);
      if (!apiKey) return;
  
      const newProvider = ProviderRegistry.registerProvider({
        providerType: isGoogle ? 'Google' : 'Mock',
        accountName: isGoogle ? 'Gemini API' : 'Test Account',
        model: isGoogle ? 'Auto' : 'Auto',
        priority: 'Primary',
        enabled: true,
        status: 'NOT_CONFIGURED',
        capabilities: ['TEXT_GENERATION', 'STRUCTURED_OUTPUT']
      });
  
      await CredentialStore.saveCredential(newProvider.id, apiKey);
      setProviders(ProviderRegistry.listProviders());
      handleTestAPI(newProvider.id);
    };
  
    const handleTestAPI = async (providerId) => {
      setIsTesting(prev => ({...prev, [providerId]: true}));
      await AIService.checkHealth(providerId);
      setProviders(ProviderRegistry.listProviders());
      setIsTesting(prev => ({...prev, [providerId]: false}));
    };
  
    return (
      <div className="p-8 max-w-6xl mx-auto space-y-6 animate-in fade-in duration-300">
        <div className="flex justify-between items-center mb-8 border-b border-slate-200 dark:border-slate-800 pb-6">
          <div>
            <h1 className="text-3xl font-bold text-slate-800 dark:text-slate-100 mb-2">{t('aiProviders')}</h1>
            <p className="text-slate-500 dark:text-slate-400">Configure connections to external AI models.</p>
          </div>
          {appSettings.advancedMode && ( <Button icon={PlusSquare} onClick={handleAddProvider}>{t('addProvider')}</Button> )}
        </div>
  
        {!appSettings.advancedMode ? (
          <div className="flex flex-col items-center justify-center p-20 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900/20 text-center">
              <Cpu size={48} className="text-slate-300 dark:text-slate-600 mb-4" />
              <h3 className="text-lg font-medium text-slate-700 dark:text-slate-300 mb-2">AI Managed Automatically</h3>
              <p className="text-slate-500 max-w-md">In Simple Mode, the system automatically selects the best AI providers to balance cost and quality for you.</p>
          </div>
        ) : providers.length === 0 ? (
          <div className="flex flex-col items-center justify-center p-20 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900/20 text-center">
              <Key size={48} className="text-slate-300 dark:text-slate-600 mb-4" />
              <p className="text-slate-500 mb-2 text-lg">No custom providers configured.</p>
              <Button icon={PlusSquare} onClick={handleAddProvider}>{t('addProvider')}</Button>
          </div>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {providers.map((p) => {
               let statusColor = 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400';
               let StatusIcon = null;
               if (p.status === 'Connected') { statusColor = 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-400 border-green-200'; StatusIcon = Check; } 
               else if (p.status === 'Development Mock' || p.status === 'Backend Required') { statusColor = 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-400 border-green-200'; StatusIcon = AlertCircle; } 
               else if (p.status.includes('Error') || p.status === 'Rate Limited' || p.status === 'Timeout' || p.status === 'Unauthorized' || p.status === 'Authentication Error') { statusColor = 'bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-400 border-red-200'; StatusIcon = X; }
  
               return (
              <Card key={p.id} className="flex flex-col group">
                <div className="flex justify-between items-start mb-4">
                   <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500"><Cpu size={16}/></div>
                      <span className="font-semibold text-slate-800 dark:text-slate-200">{p.providerType}</span>
                   </div>
                   <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded flex items-center gap-1 border border-transparent ${statusColor}`}>
                      {StatusIcon && <StatusIcon size={12}/>}
                      {p.status}
                   </span>
                </div>
                <div className="space-y-2 mb-6">
                  <p className="text-sm text-slate-600 dark:text-slate-400 font-medium">{p.accountName}</p>
                  <div className="flex items-center gap-2 text-xs text-slate-500">
                    <span className="bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">Priority: {p.priority}</span>
                    <span className="bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">Model: {p.model}</span>
                  </div>
                </div>
                <div className="mt-auto grid grid-cols-2 gap-2">
                  <Button variant="outline" className="w-full text-xs py-1.5" onClick={() => handleTestAPI(p.id)} disabled={isTesting[p.id]} icon={isTesting[p.id] ? RefreshCw : null}>
                    {isTesting[p.id] ? 'Testing...' : t('testApi')}
                  </Button>
                  <Button variant="ghost" className="w-full text-xs py-1.5" disabled>Configure</Button>
                </div>
              </Card>
            )})}
          </div>
        )}
      </div>
    );
};

const CharactersPage = ({ projects, updateProject, t }) => {
    const [selectedProjectId, setSelectedProjectId] = useState(projects[0]?.id || '');
    const [isProcessing, setIsProcessing] = useState(false);
    const [processError, setProcessError] = useState(null);
  
    const selectedProject = projects.find(p => p.id === selectedProjectId);
  
    const handleGenerate = async () => {
      if (!selectedProject) return;
      setIsProcessing(true); setProcessError(null);
      try {
        const newChars = await ImageEngine.generateCharacterBible(selectedProject);
        const updatedChars = { ...(selectedProject.characters || {}), ...newChars };
        updateProject({ ...selectedProject, characters: updatedChars });
      } catch (error) { setProcessError(error.message); } finally { setIsProcessing(false); }
    };
  
    const approveCharacter = (charId) => {
      if (!selectedProject) return;
      const updated = { ...selectedProject.characters };
      if(updated[charId]) updated[charId].status = 'USER_APPROVED';
      updateProject({ ...selectedProject, characters: updated });
    };

    const generateCharacterImage = async (charId) => {
      if (!selectedProject) return;
      setIsProcessing(true); setProcessError(null);
      try {
        const char = selectedProject.characters[charId];
        const pseudoAsset = { assetId: char.characterId, visualPrompt: char.visualPrompt };
        const updatedAsset = await ImageEngine.generateAssetImage(selectedProject, pseudoAsset);
        
        const updatedChars = { ...selectedProject.characters };
        updatedChars[charId] = { ...char, imageUrl: updatedAsset.url };
        updateProject({ ...selectedProject, characters: updatedChars });
      } catch (error) {
        setProcessError(error.message);
      } finally {
        setIsProcessing(false);
      }
    };
  
    return (
      <div className="p-8 max-w-6xl mx-auto space-y-6 animate-in fade-in duration-300">
        <div className="flex justify-between items-center mb-8 border-b border-slate-200 dark:border-slate-800 pb-6">
          <div>
            <h1 className="text-3xl font-bold text-slate-800 dark:text-slate-100 mb-2">{t('characters')}</h1>
            <p className="text-slate-500 dark:text-slate-400">Generate and manage your Character Bible.</p>
          </div>
          <div className="flex gap-4 items-center">
              <select value={selectedProjectId} onChange={(e) => setSelectedProjectId(e.target.value)} className="px-4 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none shadow-sm">
                <option value="" disabled>Select a Project...</option>
                {projects.map(p => <option key={p.id} value={p.id}>{p.title}</option>)}
              </select>
              <Button icon={UserPlus} onClick={handleGenerate} disabled={!selectedProject || isProcessing} className={isProcessing ? 'animate-pulse' : ''}>
                  {isProcessing ? 'Generating...' : t('addCharacter')}
              </Button>
          </div>
        </div>
        
        {processError && (
            <div className="p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg mb-6 dark:bg-red-900/20 dark:border-red-800 dark:text-red-400 flex items-start gap-3 shadow-sm">
               <AlertCircle size={20} className="shrink-0 mt-0.5" />
               <p className="text-sm font-medium">{processError}</p>
            </div>
         )}
  
        {!selectedProject ? (
          <div className="flex flex-col items-center justify-center p-20 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900/20">
             <p className="text-slate-500 mb-6 text-lg">Select a project to view its characters.</p>
          </div>
        ) : Object.keys(selectedProject.characters || {}).length === 0 ? (
          <div className="flex flex-col items-center justify-center p-20 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900/20">
             <p className="text-slate-500 mb-6 text-lg">No characters generated yet for this project.</p>
             <Button icon={PlayCircle} onClick={handleGenerate}>Generate Character Bible</Button>
          </div>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {Object.values(selectedProject.characters).map(char => (
               <Card key={char.characterId} className="flex flex-col h-full group">
                  <div className="flex justify-between items-start mb-4">
                     <span className="text-xs font-bold uppercase tracking-wider text-purple-600 bg-purple-100 dark:bg-purple-900/30 dark:text-purple-400 px-2 py-1 rounded">{char.role}</span>
                     {char.status === 'USER_APPROVED' ? (
                         <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400"><CheckCircle2 size={12} className="inline mr-1"/>Approved</span>
                     ) : (
                         <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400">Needs Review</span>
                     )}
                  </div>

                  {char.imageUrl && (
                      <div className="w-full h-48 mb-4 rounded-lg overflow-hidden bg-slate-100 border border-slate-200 dark:border-slate-700">
                          <img src={char.imageUrl} alt={char.name} className="w-full h-full object-cover" loading="lazy" />
                      </div>
                  )}

                  <h3 className="text-xl font-bold text-slate-800 dark:text-slate-100 mb-2">{char.name}</h3>
                  <div className="space-y-3 mb-6 text-sm text-slate-600 dark:text-slate-400 flex-1">
                     <div><span className="font-semibold text-slate-700 dark:text-slate-300">Appearance:</span> {char.physicalDescription}</div>
                     <div><span className="font-semibold text-slate-700 dark:text-slate-300">Personality:</span> {char.personality}</div>
                     <div className="p-3 bg-slate-100 dark:bg-slate-800 rounded text-xs italic">
                        <span className="font-bold not-italic block mb-1">Visual Prompt:</span>
                        "{char.visualPrompt}"
                     </div>
                  </div>
                  <div className="mt-auto grid grid-cols-2 gap-2">
                     {char.status !== 'USER_APPROVED' ? (
                         <Button variant="outline" className="w-full text-xs py-1.5" onClick={() => approveCharacter(char.characterId)}>Approve</Button>
                     ) : (
                         <div></div> 
                     )}
                     <Button 
                        variant="ghost" 
                        className="w-full text-xs py-1.5 text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 dark:bg-blue-900/30 dark:text-blue-400" 
                        onClick={() => generateCharacterImage(char.characterId)}
                        disabled={isProcessing}
                     >
                        {isProcessing ? 'Generating...' : (char.imageUrl ? 'Regenerate Image' : 'Generate Image')}
                     </Button>
                  </div>
               </Card>
            ))}
          </div>
        )}
      </div>
    );
};

const Dashboard = ({ setCurrentView, projects, t }) => {
    const formatDate = (dateString) => { try { const d = new Date(dateString); return isNaN(d.getTime()) ? 'Recently' : d.toLocaleDateString(); } catch(e) { return 'Recently'; } };
    return (
  <div className="p-8 max-w-6xl mx-auto space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
    <div className="space-y-2">
      <h1 className="text-3xl font-bold text-slate-800 dark:text-slate-100">{t('welcome')}</h1>
      <p className="text-slate-500 dark:text-slate-400 text-lg">{t('createSomething')}</p>
    </div>
    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
      <Card className="md:col-span-2 bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-blue-900/10 dark:to-indigo-900/10 border-blue-100 dark:border-blue-900/30 flex flex-col justify-center items-start p-8 shadow-sm">
        <h2 className="text-2xl font-semibold mb-2 text-slate-800 dark:text-slate-100">{t('startJourney')}</h2>
        <p className="text-slate-600 dark:text-slate-400 mb-6">{t('letAiHelp')}</p>
        <Button onClick={() => setCurrentView('new')} icon={PlusSquare} className="px-6 py-3 text-lg shadow-sm">{t('newProject')}</Button>
      </Card>
      <Card className="flex flex-col gap-4">
        <div className="flex justify-between items-center mb-2 border-b border-slate-100 dark:border-slate-800/50 pb-2">
          <h3 className="font-semibold text-slate-700 dark:text-slate-200">{t('systemStatus')}</h3>
          <Settings2 size={18} className="text-slate-400" />
        </div>
        <div className="space-y-4">
          <div className="flex justify-between items-center text-sm">
            <span className="flex items-center gap-2 text-slate-600 dark:text-slate-400"><Cpu size={16}/> Text AI</span>
            <span className="text-slate-500 dark:text-slate-500 flex items-center gap-1 font-medium bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded">Automatic</span>
          </div>
          <div className="flex justify-between items-center text-sm">
            <span className="flex items-center gap-2 text-slate-600 dark:text-slate-400"><ImageIcon size={16}/> Image AI</span>
            <span className="text-slate-500 dark:text-slate-500 flex items-center gap-1 font-medium bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded">Automatic</span>
          </div>
           <div className="flex justify-between items-center text-sm">
            <span className="flex items-center gap-2 text-slate-600 dark:text-slate-400"><GitMerge size={16}/> Workflow</span>
            <span className="text-amber-600 dark:text-amber-400 flex items-center gap-1 font-medium bg-amber-50 dark:bg-amber-900/20 px-2 py-0.5 rounded"><Clock size={14}/> Idle</span>
          </div>
        </div>
      </Card>
    </div>
    <div>
      <div className="flex justify-between items-center mb-4">
        <h2 className="text-xl font-semibold text-slate-800 dark:text-slate-100">{t('recentProjects')}</h2>
        <Button variant="ghost" onClick={() => setCurrentView('projects')}>{t('viewAll')}</Button>
      </div>
      {projects.length === 0 ? (
         <div className="p-10 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-xl text-center">
            <p className="text-slate-500 mb-4">{t('noItems')}</p>
            <Button onClick={() => setCurrentView('new')} variant="outline">{t('newProject')}</Button>
         </div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {projects.slice(0,6).map(p => (
            <Card key={p.id} className="hover:border-blue-300 dark:hover:border-blue-600 transition-colors cursor-pointer group" onClick={() => setCurrentView('workspace', {project: p})}>
              <div className="flex flex-col h-full">
                <div className="flex justify-between items-start mb-4">
                   <div className="w-10 h-10 rounded bg-blue-50 dark:bg-slate-800 flex items-center justify-center text-blue-500 border border-blue-100 dark:border-slate-700">
                     <BookOpen size={20}/>
                   </div>
                   <span className="text-[10px] text-slate-500 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">{formatDate(p.updatedAt)}</span>
                </div>
                <h3 className="font-medium text-lg text-slate-800 dark:text-slate-200 mb-1 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">{p.title}</h3>
                <p className="text-sm text-slate-500 dark:text-slate-400 mt-auto">{p.bookType} • {t('draft')}</p>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  </div>
)};

const NewProject = ({ setCurrentView, handleCreateProject, initialType, t }) => {
    const [title, setTitle] = useState('');
    const [bookType, setBookType] = useState(initialType || 'Ebook');
    const [style, setStyle] = useState('Modern');
    const [language, setLanguage] = useState('ไทย');
    const [quality, setQuality] = useState('Balanced');
    const [error, setError] = useState('');
  
    const BOOK_TYPES = [{id: 'Ebook', label: 'Ebook'}, {id: 'หนังสือพิมพ์', label: 'หนังสือพิมพ์'}, {id: 'Magazine', label: 'นิตยสาร'}, {id: 'Workbook', label: 'แบบฝึกหัด'}, {id: 'Children Book', label: 'หนังสือเด็ก'}, {id: 'Novel', label: 'นิยาย'}, {id: 'Comic', label: 'การ์ตูน'}, {id: 'Catalog', label: 'แคตตาล็อก'}, {id: 'Custom', label: 'กำหนดเอง'}];
    const STYLES = ['Minimal', 'Modern', 'Luxury', 'Editorial', 'Classic', 'Vintage', 'Fantasy', 'Children', 'Cinematic', 'Professional'];
    const LANGUAGES = ['ไทย', 'English', '中文', '日本語', '한국어', 'Español', 'Français', 'Deutsch'];
    const QUALITIES = [{ id: 'Economy', title: t('qEconomy'), desc: t('qEconomyDesc') }, { id: 'Balanced', title: t('qBalanced'), desc: t('qBalancedDesc') }, { id: 'High', title: t('qHigh'), desc: t('qHighDesc') }];
  
    const onSubmit = () => {
      if (!title.trim()) { setError(t('titleRequired')); return; }
      const newProjectData = AppModels.Project({ title, bookType, style, language, quality });
      handleCreateProject(newProjectData);
    };
  
    const BasicGrid = ({ items, current, setter }) => (
      <div className="flex flex-wrap gap-3">
        {items.map(item => {
          const value = typeof item === 'object' ? item.id : item;
          const label = typeof item === 'object' ? item.label : item;
          return (
            <button key={value} onClick={() => setter(value)}
              className={`px-4 py-2 rounded-lg text-sm transition-all border ${current === value ? 'bg-blue-100 border-blue-400 text-blue-800 dark:bg-blue-900/40 dark:border-blue-500/80 dark:text-blue-200 font-medium shadow-sm ring-1 ring-blue-300 dark:ring-blue-500' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50 dark:bg-slate-800/80 dark:border-slate-700/80 dark:text-slate-400 hover:border-slate-300'}`}
            >
              {label}
            </button>
          );
        })}
      </div>
    );
  
    return (
      <div className="p-8 max-w-4xl mx-auto space-y-10 animate-in fade-in duration-300 pb-20">
        <div className="text-center max-w-2xl mx-auto mb-10">
          <h1 className="text-4xl font-bold text-slate-800 dark:text-slate-100 mb-4">{t('createNewProject')}</h1>
          <p className="text-slate-500 dark:text-slate-400 text-lg leading-relaxed">{t('startWithTitle')}</p>
        </div>
        <div className="space-y-10 bg-slate-50 dark:bg-slate-900/30 p-8 rounded-2xl border border-slate-100 dark:border-slate-800/50 shadow-sm">
          <div className="space-y-3">
            <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 tracking-wide">{t('bookTitle')}</label>
            <input type="text" value={title} onChange={(e) => { setTitle(e.target.value); setError(''); }} placeholder={t('titlePlaceholder')}
              className={`w-full text-2xl p-5 rounded-xl bg-white dark:bg-slate-800 border-2 shadow-sm ${error ? 'border-red-400 focus:ring-red-200' : 'border-slate-200 focus:border-blue-400 focus:ring-4 focus:ring-blue-100'} outline-none transition-all dark:text-slate-100`}
            />
            {error && <p className="text-red-500 text-sm flex items-center gap-1 mt-2 font-medium"><AlertCircle size={14}/>{error}</p>}
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
              <div className="space-y-4"><label className="block text-sm font-bold text-slate-700 dark:text-slate-300 tracking-wide">{t('bookType')}</label><BasicGrid items={BOOK_TYPES} current={bookType} setter={setBookType} /></div>
              <div className="space-y-4">
                <div className="flex justify-between items-end">
                    <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 tracking-wide">{t('style')}</label>
                    <button className="text-xs text-blue-600 dark:text-blue-400 hover:underline">{t('viewAllStyles')}</button>
                </div>
                <BasicGrid items={STYLES} current={style} setter={setStyle} />
              </div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-10 pt-6 border-t border-slate-200 dark:border-slate-800/80">
            <div className="space-y-4"><label className="block text-sm font-bold text-slate-700 dark:text-slate-300 tracking-wide">{t('bookLanguage')}</label><BasicGrid items={LANGUAGES} current={language} setter={setLanguage} /></div>
            <div className="space-y-4">
              <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 tracking-wide">{t('quality')}</label>
              <div className="flex flex-col gap-3">
                {QUALITIES.map(q => (
                  <button key={q.id} onClick={() => setQuality(q.id)} className={`flex flex-col text-left p-4 rounded-xl transition-all border ${quality === q.id ? 'bg-blue-50 border-blue-400 ring-1 ring-blue-300 dark:bg-blue-900/30' : 'bg-white border-slate-200 hover:bg-slate-50 dark:bg-slate-800/80'}`}>
                    <span className={`font-semibold mb-1 ${quality === q.id ? 'text-blue-800 dark:text-blue-300' : 'text-slate-700'}`}>{q.title}</span>
                    <span className={`text-xs ${quality === q.id ? 'text-blue-600/80' : 'text-slate-500'}`}>{q.desc}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
          <div className="pt-10 flex justify-center">
            <Button onClick={onSubmit} icon={PlayCircle} size="lg" className={`px-12 font-bold shadow-md ${!title.trim() ? 'opacity-70 grayscale' : 'bg-blue-500 hover:bg-blue-600 text-white border-none'}`}>
              {t('createProjectBtn')}
            </Button>
          </div>
        </div>
      </div>
    );
};

export default function App() {
  const [appSettings, setAppSettings] = useState(StorageService.getSettings());
  const [projects, setProjects] = useState(StorageService.getProjects());
  const [currentView, setCurrentView] = useEphemeralState('aipub_v3_view', 'dashboard');
  const [activeProject, setActiveProject] = useEphemeralState('aipub_v3_active_project', null);
  const [templatePrep, setTemplatePrep] = useEphemeralState('aipub_v3_template', null);

  const t = useCallback((key) => translations[appSettings.uiLang]?.[key] || translations['en'][key] || key, [appSettings.uiLang]);

  const updateSettings = (newSettings) => {
    const updated = { ...appSettings, ...newSettings };
    setAppSettings(updated);
    StorageService.saveSettings(updated);
  };

  useEffect(() => {
    if (appSettings.isDarkMode) {
      document.documentElement.classList.add('dark');
      document.body.classList.add('dark', 'bg-slate-950');
      document.body.classList.remove('bg-white');
    } else {
      document.documentElement.classList.remove('dark');
      document.body.classList.remove('dark', 'bg-slate-950');
      document.body.classList.add('bg-white');
    }
  }, [appSettings.isDarkMode]);

  const handleCreateProject = (projectModelData) => {
    const savedProject = StorageService.saveProject(projectModelData);
    setProjects(StorageService.getProjects());
    setActiveProject(savedProject);
    setTemplatePrep(null);
    navigate('workspace');
  };

  const handleUpdateProject = (updatedData) => {
    const savedProject = StorageService.saveProject(updatedData);
    setProjects(StorageService.getProjects());
    setActiveProject(savedProject);
  }

  const navigate = (view, params = {}) => {
    if (params.project) setActiveProject(params.project);
    if (params.templateTag) setTemplatePrep(params.templateTag);
    setCurrentView(view);
  };

  const renderContent = () => {
    switch(currentView) {
      case 'dashboard': return <Dashboard setCurrentView={navigate} projects={projects} t={t} />;
      case 'new': return <NewProject setCurrentView={navigate} handleCreateProject={handleCreateProject} initialType={templatePrep} t={t} />;
      case 'workspace': return <ProjectWorkspace project={activeProject} updateProject={handleUpdateProject} appSettings={appSettings} t={t} />;
      case 'settings': return <SettingsPage appSettings={appSettings} updateSettings={updateSettings} t={t} />;
      case 'ai-providers': return <AIProvidersPage t={t} appSettings={appSettings} />;
      case 'projects': return <GenericLibraryPage title={t('projects')} description="Manage your publications." actionText={t('newProject')} actionIcon={PlusSquare} onActionClick={() => navigate('new')} items={projects.map(p => ({title: p.title, desc: `${p.bookType} • ${p.status}`, tag: p.bookType, onClickData: p}))} onCardClick={(item) => navigate('workspace', {project: item.onClickData})} t={t} />;
      case 'templates': return <GenericLibraryPage title={t('templates')} description="Start quickly with pre-designed structures." items={[{title: 'Ebook', tag: 'Ebook', desc: 'Clean layout.', imgPreview: true, icon: BookOpen}, {title: 'Magazine', tag: 'Magazine', desc: 'Editorial typography.', imgPreview: true, icon: LayoutTemplate}]} onCardClick={(item) => navigate('new', {templateTag: item.tag})} t={t} />;
      case 'characters': return <CharactersPage projects={projects} updateProject={handleUpdateProject} t={t} />;
      case 'images': return <GenericLibraryPage title={t('images')} description="Manage assets." actionText={t('addImage')} actionIcon={ImagePlus} items={[]} t={t} />;
      case 'workflows': return <GenericLibraryPage title={t('workflows')} description="Automated sequences." items={[{title: 'Complete Book AI', tag: 'Full Auto', desc: 'From idea to formatted PDF.'}]} t={t} />;
      case 'exports': return <GlobalExportsPage projects={projects} />;
      default: return <Dashboard setCurrentView={navigate} projects={projects} t={t} />;
    }
  };

  return (
    <div className={`flex h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans transition-colors duration-300 ${appSettings.isDarkMode ? 'dark' : ''}`}>
      <Sidebar currentView={currentView} setCurrentView={navigate} t={t} />
      <div className="flex-1 flex flex-col overflow-hidden relative">
        <TopBar title={t('appTitle')} appSettings={appSettings} updateSettings={updateSettings} t={t} />
        <main className="flex-1 overflow-y-auto bg-slate-50 dark:bg-[#0f111a] relative custom-scrollbar">
          {renderContent()}
        </main>
      </div>
      <style dangerouslySetInnerHTML={{__html: `
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.3); border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(71, 85, 105, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(156, 163, 175, 0.5); }
      `}} />
    </div>
  );
}
